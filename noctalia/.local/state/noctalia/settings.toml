[bar.default]
capsule = true
end = [
    "tray",
    "notifications",
    "clipboard",
    "network",
    "bluetooth",
    "volume",
    "brightness",
    "battery",
    "control-center",
    "session"
]
font_family = "SF Pro Text"
font_weight = 600
shadow = false
start = [ "launcher", "wallpaper", "workspaces", "media", "active_window" ]

[dock]
shadow = false

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@HDMI-A-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 70.0
    box_width = 400.0
    cx = 960.0
    cy = 961.0
    output = "HDMI-A-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        input_opacity = 1.0
        input_radius = 6.0
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_password_hint = true

[nightlight]
enabled = true
force = true
temperature_day = 3700

[shell]
font_family = "SF Pro Text"
ui_scale = 1.4000000134110451

    [shell.panel]
    shadow = false

[theme]
builtin = "Kanagawa"
community_palette = "Kemuri"
source = "community"

    [theme.templates]
    builtin_ids = [ "gtk3", "gtk4", "hyprland", "qt" ]
    community_ids = [ "papirus-icons" ]

[wallpaper.default]
path = "/home/pedro/Pictures/Wallpapers/catholicon-holy-sepulchre.jpg"

[wallpaper.last]
path = "/home/pedro/Pictures/Wallpapers/catholicon-holy-sepulchre.jpg"

[wallpaper.monitors.HDMI-A-1]
path = "/home/pedro/Pictures/Wallpapers/catholicon-holy-sepulchre.jpg"

[widget.media]
hide_when_no_media = true

[widget.network]
show_label = false